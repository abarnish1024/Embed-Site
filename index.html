<!DOCTYPE html>
<!-- Edit this file (root index.html) to change the live site. Push to main to update. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Team Portal | Performance &amp; Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise"></div>

  <header class="app-bar">
    <a href="./" class="app-bar__logo">
      <span class="app-bar__logo-icon">◈</span>
      <span class="app-bar__logo-text">F1 Team Portal</span>
    </a>
    <div class="app-bar__right">
      <p id="viewing-as" class="app-bar__team viewing-as-badge"></p>
      <a href="login.html" class="app-bar__switch switch-team-link">Switch team</a>
    </div>
  </header>

  <main class="app-main" id="demo">
    <div class="embed-container">
      <iframe
        id="omni-embed-iframe"
        data-embed-api="/api/embed-url"
        title="Team dashboard"
        allow="fullscreen"
        loading="lazy"
      ></iframe>
      <p id="embed-status" class="embed-status" aria-live="polite"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
