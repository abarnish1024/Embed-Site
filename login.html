<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select team | F1 Team Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise"></div>

  <header class="app-bar">
    <a href="./" class="app-bar__logo">
      <span class="app-bar__logo-icon">◈</span>
      <span class="app-bar__logo-text">F1 Team Portal</span>
    </a>
    <a href="index.html" class="app-bar__switch">Dashboard</a>
  </header>

  <main class="login-main">
    <section class="login-card">
      <h1>Select your team</h1>
      <p class="login-desc">
        Choose your constructor to view the team dashboard. You&rsquo;ll see stats and analytics filtered for that team.
      </p>
      <form id="login-form" class="login-form">
        <label for="team-select" class="login-label">F1 team</label>
        <select id="team-select" class="login-select" required>
          <option value="" disabled selected>Select a team</option>
          <option value="mercedes">Mercedes</option>
          <option value="red-bull">Red Bull</option>
          <option value="ferrari">Ferrari</option>
          <option value="mclaren">McLaren</option>
          <option value="alpine">Alpine</option>
          <option value="aston-martin">Aston Martin</option>
          <option value="williams">Williams</option>
          <option value="rb">RB</option>
          <option value="haas">Haas</option>
          <option value="sauber">Kick Sauber</option>
        </select>
        <button type="submit" class="btn btn-primary">View dashboard</button>
      </form>
      <p class="login-note">Your dashboard will load with this team&rsquo;s context and theme.</p>
    </section>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var select = document.getElementById('team-select');
      var externalId = select.value;
      var name = select.options[select.selectedIndex].text;
      if (externalId && name) {
        try {
          sessionStorage.setItem('demoUser', JSON.stringify({ externalId: externalId, name: name }));
        } catch (err) {}
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
